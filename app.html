<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Discord Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-tertiary:#202225;--bg-secondary:#2f3136;--bg-primary:#36393f;--bg-modifier-hover:rgba(79,84,92,0.32);--bg-modifier-selected:rgba(79,84,92,0.48);--text-normal:#dcddde;--text-muted:#72767d;--header-primary:#fff;--header-secondary:#b9bbbe;--brand:#5865F2;--green:#3ba55d;--red:#ed4245}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-normal);height:100vh;overflow:hidden}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input{font-family:inherit;outline:none;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px}
.app{display:flex;height:100vh}
.servers-sidebar{width:72px;background:var(--bg-tertiary);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.server-icon{width:48px;height:48px;border-radius:50%;background:var(--bg-primary);color:var(--text-normal);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;cursor:pointer;transition:all .2s;overflow:hidden;background-size:cover;background-position:center}
.server-icon:hover,.server-icon.active{border-radius:16px;background:var(--brand);color:#fff}
.server-icon.home{background:var(--brand);color:#fff}
.server-icon.add{background:var(--bg-primary);color:var(--green);font-size:24px}
.server-sep{width:32px;height:2px;background:var(--bg-primary);border-radius:1px}
.channels-sidebar{width:240px;background:var(--bg-secondary);display:flex;flex-direction:column}
.server-header{height:48px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.24);font-weight:600;color:var(--header-primary);font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.channels-list{flex:1;overflow-y:auto;padding:8px 0}
.category{margin-top:16px}
.category-header{padding:0 16px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;display:flex;align-items:center;gap:4px;cursor:pointer}
.channel{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 16px;margin:1px 8px;border-radius:4px;color:#72767d;cursor:pointer;font-size:15px;font-weight:500}
.channel:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.channel.active{background:var(--bg-modifier-selected);color:#fff}
.channel-icon{font-size:20px;flex-shrink:0}
.channel-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-panel{height:52px;background:#292b2f;display:flex;align-items:center;padding:0 8px;gap:8px}
.user-panel-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.user-panel-avatar .status-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:3px solid #292b2f}
.status-dot.online{background:var(--green)}
.status-dot.idle{background:#faa81a}
.status-dot.dnd{background:var(--red)}
.user-panel-info{flex:1;min-width:0;cursor:pointer}
.user-panel-name{font-size:14px;font-weight:600;color:var(--header-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-panel-tag{font-size:12px;color:var(--text-muted)}
.user-panel-btns{display:flex;gap:4px}
.user-panel-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#b9bbbe;font-size:18px}
.user-panel-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.24);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.chat-header-left{display:flex;align-items:center;gap:8px}
.chat-header-icon{color:var(--text-muted);font-size:22px}
.chat-header-title{font-weight:600;color:var(--header-primary);font-size:15px}
.chat-header-actions{display:flex;gap:8px}
.chat-header-btn{width:24px;height:24px;color:#b9bbbe;font-size:18px;display:flex;align-items:center;justify-content:center}
.chat-header-btn:hover{color:var(--text-normal)}
.messages-container{flex:1;overflow-y:auto;padding:16px 0}
.message-group{display:flex;padding:2px 16px 2px 72px;position:relative;margin-top:16px}
.message-group:hover{background:rgba(4,4,5,.07)}
.message-avatar{position:absolute;left:16px;width:40px;height:40px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.message-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.message-author{font-weight:500;color:var(--header-primary);font-size:15px;cursor:pointer}
.message-author:hover{text-decoration:underline}
.message-timestamp{font-size:12px;color:var(--text-muted)}
.message-content{color:var(--text-normal);font-size:15px;line-height:1.375;word-wrap:break-word;white-space:pre-wrap}
.message-content img{max-width:400px;max-height:300px;border-radius:4px;margin-top:4px;cursor:pointer}
.message-reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.reaction{display:flex;align-items:center;gap:4px;padding:2px 6px;background:var(--bg-secondary);border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:14px}
.reaction:hover{border-color:var(--brand);background:rgba(88,101,242,.15)}
.reaction.own{border-color:var(--brand);background:rgba(88,101,242,.3)}
.reaction-count{font-size:12px;color:var(--text-muted);font-weight:600}
.message-hover-actions{position:absolute;top:-16px;right:16px;background:var(--bg-secondary);border:1px solid rgba(0,0,0,.24);border-radius:4px;display:none;overflow:hidden}
.message-group:hover .message-hover-actions{display:flex}
.msg-action-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#b9bbbe;font-size:18px}
.msg-action-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.msg-action-btn.danger:hover{background:var(--red);color:#fff}
.edited-tag{font-size:10px;color:var(--text-muted);font-style:italic;margin-left:4px}
.input-container{padding:0 16px 24px}
.input-wrapper{background:#40444b;border-radius:8px;display:flex;align-items:center;padding:2px 16px;min-height:44px}
.input-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#b9bbbe;font-size:20px}
.input-btn:hover{color:var(--text-normal)}
.message-input{flex:1;background:transparent;color:var(--text-normal);font-size:15px;padding:11px 8px}
.message-input::placeholder{color:var(--text-muted)}
.members-sidebar{width:240px;background:var(--bg-secondary);overflow-y:auto;padding:16px 0}
.member-category{padding:0 16px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-top:16px}
.member{display:flex;align-items:center;gap:12px;padding:4px 8px;margin:0 8px;border-radius:4px;cursor:pointer}
.member:hover{background:var(--bg-modifier-hover)}
.member-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;overflow:hidden;background-size:cover;background-position:center}
.member-avatar .status-dot{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;border:3px solid var(--bg-secondary)}
.member-name{font-size:15px;font-weight:500;color:var(--text-muted)}
.member:hover .member-name{color:var(--text-normal)}
.member.offline{opacity:.4}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-primary);border-radius:5px;max-width:440px;width:90%;box-shadow:0 8px 16px rgba(0,0,0,.24)}
.modal-header{padding:20px 20px 0;font-size:20px;font-weight:700;color:var(--header-primary)}
.modal-body{padding:16px 20px}
.modal-footer{padding:16px 20px;background:var(--bg-secondary);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 5px 5px}
.modal-input{width:100%;background:var(--bg-tertiary);border:1px solid rgba(0,0,0,.3);border-radius:3px;padding:10px;color:var(--text-normal);font-size:14px}
.modal-input:focus{border-color:var(--brand)}
.btn{padding:10px 16px;border-radius:3px;font-size:14px;font-weight:500}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-secondary{background:transparent;color:var(--text-normal)}
.btn-danger{background:var(--red);color:#fff}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--header-secondary);text-transform:uppercase;margin-bottom:8px}
.form-select{width:100%;background:var(--bg-tertiary);border:1px solid rgba(0,0,0,.3);border-radius:3px;padding:10px;color:var(--text-normal);font-size:14px}
.settings-overlay{display:none;position:fixed;inset:0;background:var(--bg-primary);z-index:1500}
.settings-overlay.show{display:flex}
.settings-sidebar{width:220px;background:var(--bg-secondary);padding:60px 0 20px 20px;overflow-y:auto}
.settings-nav-item{padding:8px 12px;border-radius:4px;color:#b9bbbe;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px}
.settings-nav-item:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.settings-nav-item.active{background:var(--bg-modifier-selected);color:#fff}
.settings-nav-category{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:16px 12px 4px}
.settings-content{flex:1;padding:60px 40px;overflow-y:auto}
.settings-title{font-size:20px;font-weight:700;color:var(--header-primary);margin-bottom:20px}
.settings-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:var(--bg-secondary);color:var(--text-normal);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.avatar-upload{width:100px;height:100px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600;position:relative;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <div class="servers-sidebar" id="serversSidebar">
    <div class="server-icon home" onclick="window.showHome()">💬</div>
    <div class="server-sep"></div>
    <div id="serversList"></div>
    <div class="server-icon add" onclick="window.showCreateServerModal()">+</div>
  </div>
  <div class="channels-sidebar">
    <div class="server-header"><span id="serverName">Личные сообщения</span></div>
    <div class="channels-list" id="channelsList"></div>
    <div class="user-panel">
      <div class="user-panel-avatar" id="userPanelAvatar" onclick="window.showSettings()">?<div class="status-dot online" id="userStatusDot"></div></div>
      <div class="user-panel-info" onclick="window.showSettings()">
        <div class="user-panel-name" id="userPanelName">User</div>
        <div class="user-panel-tag" id="userPanelTag">#0001</div>
      </div>
      <div class="user-panel-btns">
        <button class="user-panel-btn" onclick="window.toggleGlobalMute()" id="globalMuteBtn">🎤</button>
        <button class="user-panel-btn" onclick="window.showSettings()">⚙️</button>
      </div>
    </div>
  </div>
  <div class="chat-main">
    <div class="chat-header">
      <div class="chat-header-left">
        <span class="chat-header-icon" id="chatHeaderIcon">#</span>
        <span class="chat-header-title" id="chatHeaderTitle">Добро пожаловать</span>
      </div>
      <div class="chat-header-actions">
        <button class="chat-header-btn" onclick="window.toggleSearch()">🔍</button>
        <button class="chat-header-btn" onclick="window.showPinned()">📌</button>
        <button class="chat-header-btn" onclick="window.toggleMembers()">👥</button>
      </div>
    </div>
    <div class="messages-container" id="messagesContainer">
      <div id="messagesWrapper">
        <div style="text-align:center;color:var(--text-muted);padding:60px 20px;">
          <div style="font-size:64px;margin-bottom:16px;">💬</div>
          <div style="font-size:20px;font-weight:600;color:var(--header-primary);margin-bottom:8px;">Добро пожаловать</div>
          <div style="font-size:14px;">Выберите сервер и канал</div>
        </div>
      </div>
    </div>
    <div class="input-container">
      <div class="input-wrapper">
        <button class="input-btn" onclick="window.toggleEmojiPicker()">😊</button>
        <button class="input-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="window.handleFileSelect(event)">
        <input type="text" class="message-input" id="messageInput" placeholder="Написать сообщение" onkeypress="window.handleMessageKey(event)">
        <button class="input-btn" onclick="window.sendMessage()">➤</button>
      </div>
    </div>
  </div>
  <div class="members-sidebar" id="membersSidebar" style="display:none;">
    <div id="membersList"></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="settings-overlay" id="settingsOverlay">
  <button class="settings-close" onclick="window.hideSettings()">✕</button>
  <div class="settings-sidebar">
    <div class="settings-nav-category">Настройки пользователя</div>
    <div class="settings-nav-item active" onclick="window.showSettingsTab('account',this)">Мой аккаунт</div>
    <div class="settings-nav-item" onclick="window.showSettingsTab('appearance',this)">Внешний вид</div>
    <div class="settings-nav-item" onclick="window.showSettingsTab('voice',this)">Голос и видео</div>
    <div class="settings-nav-item" onclick="window.confirmLogout()" style="color:var(--red);margin-top:20px;">Выйти</div>
  </div>
  <div class="settings-content" id="settingsContent"></div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import{getFirestore,doc,getDoc,updateDoc,arrayUnion,arrayRemove,onSnapshot,collection,addDoc,query,orderBy,serverTimestamp,setDoc,where,getDocs,deleteDoc,limit,startAfter}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig={apiKey:"AIzaSyBSAzrVn3G9_14VtQZ9TkffdNlhwPe0HkE",authDomain:"ss-a7e6b.firebaseapp.com",projectId:"ss-a7e6b",storageBucket:"ss-a7e6b.firebasestorage.app",messagingSenderId:"919088676851",appId:"1:919088676851:web:a1c73cbd463143fff19c86",measurementId:"G-WBVDW0EMDX"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null,currentUserData=null;
let currentServerId=null,currentChannelId=null,currentChannelType=null,currentChannelName=null;
let messagesUnsub=null,channelsUnsub=null,membersUnsub=null;
let lastMessageDoc=null,isLoadingMore=false;
let allMessagesCache=[];
let replyTo=null,selectedFile=null;

const EMOJIS=['😀','😃','😄','😁','😆','','🤣','😂','🙂','','😉','😊','😇','','😍','🤩','😘','😗','😚','😙','🥲','😛','','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','🙄','😬','😮‍💨','','😔','😪','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','','🤯','🤠','🥳','🥸','','🧐','😟','','☹️','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😤','😡','😠','🤬','😈','👿','💀','☠️','💩','','👹','👺','','👽','👾','🤖','😺','😸','😹','😻','😼','😽','🙀','😿','😾','❤️','🧡','💛','💚','💙','💜','🖤','','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟'];
const REACTION_EMOJIS=['','👎','❤️','','😂','😮','','😡','🎉','👏','💯','✨'];

onAuthStateChanged(auth,async(user)=>{
  if(!user){window.location.href='index.html';return;}
  currentUser=user;
  try{
    const userDoc=await getDoc(doc(db,'users',user.uid));
    if(userDoc.exists()){
      currentUserData=userDoc.data();
    }else{
      const name=user.displayName||user.email.split('@')[0]||'User';
      const disc=String(Math.floor(Math.random()*9000)+1000);
      await setDoc(doc(db,'users',user.uid),{uid:user.uid,name:name,email:user.email,friends:[],servers:[],status:'online',avatar:null,customStatus:'',discriminator:disc});
      currentUserData={uid:user.uid,name:name,email:user.email,friends:[],servers:[],status:'online',avatar:null,customStatus:'',discriminator:disc};
    }
    window.updateUserPanel();
    window.loadServers();
  }catch(e){console.error(e);}
});

window.updateUserPanel=function(){
  const d=currentUserData;
  document.getElementById('userPanelName').textContent=d.name||'User';
  document.getElementById('userPanelTag').textContent='#'+(d.discriminator||'0001');
  const av=document.getElementById('userPanelAvatar');
  if(d.avatar){av.style.backgroundImage='url('+d.avatar+')';av.textContent='';}
  else{av.textContent=(d.name||'U').charAt(0).toUpperCase();}
  const dot=document.getElementById('userStatusDot');
  dot.className='status-dot '+(d.status||'online');
};

window.loadServers=async function(){
  const list=document.getElementById('serversList');
  list.innerHTML='';
  const servers=currentUserData.servers||[];
  for(const sid of servers){
    try{
      const sdoc=await getDoc(doc(db,'servers',sid));
      if(sdoc.exists()){
        const sdata=sdoc.data();
        const icon=document.createElement('div');
        icon.className='server-icon';
        icon.textContent=(sdata.name||'?').charAt(0).toUpperCase();
        icon.title=sdata.name;
        icon.onclick=function(){window.openServer(sid,sdata.name,icon);};
        list.appendChild(icon);
      }
    }catch(e){}
  }
};

window.openServer=async function(serverId,name,el){
  currentServerId=serverId;
  document.querySelectorAll('.server-icon').forEach(function(i){i.classList.remove('active');});
  if(el)el.classList.add('active');
  document.getElementById('serverName').textContent=name;
  window.loadChannels(serverId);
};

window.showHome=function(){
  currentServerId=null;currentChannelId=null;currentChannelType=null;
  document.querySelectorAll('.server-icon').forEach(function(i){i.classList.remove('active');});
  document.querySelector('.server-icon.home').classList.add('active');
  document.getElementById('serverName').textContent='Личные сообщения';
  document.getElementById('chatHeaderIcon').textContent='💬';
  document.getElementById('chatHeaderTitle').textContent='Личные сообщения';
  window.loadDMChannels();
  document.getElementById('membersSidebar').style.display='none';
};

window.loadChannels=function(serverId){
  if(channelsUnsub)channelsUnsub();
  const list=document.getElementById('channelsList');
  list.innerHTML='';
  const q=query(collection(db,'servers',serverId,'channels'),orderBy('position','asc'));
  channelsUnsub=onSnapshot(q,function(snap){
    list.innerHTML='';
    const channels=[];
    snap.forEach(function(d){channels.push({id:d.id,name:d.data().name,type:d.data().type,category:d.data().category,position:d.data().position});});
    const grouped={};
    channels.forEach(function(c){
      const cat=c.category||'Текстовые каналы';
      if(!grouped[cat])grouped[cat]=[];
      grouped[cat].push(c);
    });
    Object.keys(grouped).forEach(function(cat){
      const chs=grouped[cat];
      const catDiv=document.createElement('div');
      catDiv.className='category';
      catDiv.innerHTML='<div class="category-header"><span>⌄</span><span>'+cat+'</span><span style="margin-left:auto;font-size:16px;" onclick="event.stopPropagation();window.showCreateChannelModal(\''+serverId+'\',\''+cat+'\')">+</span></div>';
      const chsDiv=document.createElement('div');
      chs.forEach(function(ch){
        const chDiv=document.createElement('div');
        chDiv.className='channel'+(currentChannelId===ch.id?' active':'');
        const icon=ch.type==='voice'?'🔊':'#';
        chDiv.innerHTML='<span class="channel-icon">'+icon+'</span><span class="channel-name">'+ch.name+'</span>';
        chDiv.onclick=function(){window.openChannel(serverId,ch.id,ch.type,ch.name,chDiv);};
        chsDiv.appendChild(chDiv);
      });
      catDiv.appendChild(chsDiv);
      list.appendChild(catDiv);
    });
  });
};

window.loadDMChannels=async function(){
  const list=document.getElementById('channelsList');
  list.innerHTML='';
  const friends=currentUserData.friends||[];
  const catDiv=document.createElement('div');
  catDiv.className='category';
  catDiv.innerHTML='<div class="category-header"><span>👤</span><span>Личные сообщения</span></div>';
  const chsDiv=document.createElement('div');
  for(const fid of friends){
    try{
      const fdoc=await getDoc(doc(db,'users',fid));
      if(fdoc.exists()){
        const fd=fdoc.data();
        const chDiv=document.createElement('div');
        chDiv.className='channel';
        chDiv.innerHTML='<span class="channel-icon" style="font-size:24px;">👤</span><span class="channel-name">'+fd.name+'</span>';
        chDiv.onclick=function(){window.openDM(fid,fd.name,chDiv);};
        chsDiv.appendChild(chDiv);
      }

window.loadMessages=async function(serverId,channelId){
  if(messagesUnsub)messagesUnsub();
  lastMessageDoc=null;allMessagesCache=[];
  const wrapper=document.getElementById('messagesWrapper');
  wrapper.innerHTML='';
  const colPath=serverId?('servers/'+serverId+'/channels/'+channelId+'/messages'):('dm/'+channelId+'/messages');
  const q=query(collection(db,colPath),orderBy('timestamp','desc'),limit(30));
  const snap=await getDocs(q);
  if(snap.empty){
    wrapper.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:60px 20px;"><div style="font-size:48px;margin-bottom:16px;">💬</div><div style="font-size:16px;">Начните общение!</div></div>';
  }else{
    lastMessageDoc=snap.docs[snap.docs.length-1];
    const msgs=[];
    snap.docs.forEach(function(d){msgs.push(d);});
    msgs.reverse();
    msgs.forEach(function(d){
      const m=d.data();
      allMessagesCache.push({id:d.id,name:m.senderName,text:m.text,timestamp:m.timestamp});
      window.renderMessage(m,d.id);
    });
    setTimeout(function(){
      const container=document.getElementById('messagesContainer');
      container.scrollTop=container.scrollHeight;
    },100);
  }
  const liveQ=query(collection(db,colPath),orderBy('timestamp','asc'));
  messagesUnsub=onSnapshot(liveQ,function(snap){
    snap.docChanges().forEach(function(change){
      const m=change.doc.data();
      if(change.type==='added'){
        if(document.getElementById('msg-'+change.doc.id))return;
        allMessagesCache.push({id:change.doc.id,name:m.senderName,text:m.text,timestamp:m.timestamp});
        window.renderMessage(m,change.doc.id);
        const container=document.getElementById('messagesContainer');
        const isAtBottom=container.scrollHeight-container.scrollTop-container.clientHeight<100;
        if(m.senderId===currentUser.uid||isAtBottom){
          container.scrollTop=container.scrollHeight;
        }
        if(m.senderId!==currentUser.uid){
          updateDoc(change.doc.ref,{readBy:arrayUnion('delivered')},{merge:true}).catch(function(){});
        }
      }else if(change.type==='modified'){
        const el=document.getElementById('msg-'+change.doc.id);
        if(el){
          const content=el.querySelector('.message-content-text');
          if(content)content.innerHTML=window.formatMessageText(m.text||'')+(m.isEdited?'<span class="edited-tag">(изменено)</span>':'');
          const reactions=el.querySelector('.message-reactions');
          if(reactions)reactions.innerHTML=window.renderReactions(m.reactions||{});
        }
      }else if(change.type==='removed'){
        const el=document.getElementById('msg-'+change.doc.id);
        if(el)el.remove();
      }
    });
  });
};

window.renderMessage=function(m,msgId){
  const wrapper=document.getElementById('messagesWrapper');
  const time=m.timestamp?new Date(m.timestamp.toDate()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
  const isOwn=m.senderId===currentUser.uid;
  const avatarStyle=m.senderAvatar?('background-image:url('+m.senderAvatar+')'):'';
  const avatarText=m.senderAvatar?'':(m.senderName||'?').charAt(0).toUpperCase();
  const div=document.createElement('div');
  div.className='message-group';
  div.id='msg-'+msgId;
  let html='<div class="message-avatar" style="'+avatarStyle+'">'+avatarText+'</div>';
  html+='<div style="flex:1;min-width:0;">';
  html+='<div class="message-header">';
  html+='<span class="message-author">'+(m.senderName||'Unknown')+'</span>';
  html+='<span class="message-timestamp">Сегодня в '+time+'</span>';
  html+='</div>';
  html+='<div class="message-content">';
  if(m.replyTo){
    html+='<div style="background:var(--bg-secondary);border-left:2px solid var(--text-muted);padding:4px 8px;margin-bottom:4px;border-radius:4px;font-size:13px;color:var(--text-muted);"><span style="color:var(--header-primary);font-weight:500;">'+m.replyTo.senderName+'</span>: '+(m.replyTo.text||'').substring(0,80)+'</div>';
  }
  if(m.image){
    html+='<img src="'+m.image+'" onclick="window.openLightbox(\''+m.image.replace(/'/g,"\\'")+'\')">';
  }
  html+='<div class="message-content-text">'+window.formatMessageText(m.text||'')+(m.isEdited?'<span class="edited-tag">(изменено)</span>':'')+'</div>';
  html+='<div class="message-reactions">'+window.renderReactions(m.reactions||{})+'</div>';
  html+='</div></div>';
  html+='<div class="message-hover-actions">';
  html+='<button class="msg-action-btn" onclick="window.showReactionPicker(\''+msgId+'\',event)" title="Реакция">😊</button>';
  html+='<button class="msg-action-btn" onclick="window.startReply(\''+msgId+'\',\''+(m.senderName||'').replace(/'/g,"\\'")+'\',\''+(m.text||'').substring(0,60).replace(/'/g,"\\'")+'\')" title="Ответить">↩️</button>';
  if(isOwn){
    html+='<button class="msg-action-btn" onclick="window.editMessage(\''+msgId+'\',\''+(m.text||'').replace(/'/g,"\\'")+'\')" title="Редактировать">✏️</button>';
    html+='<button class="msg-action-btn danger" onclick="window.deleteMessage(\''+msgId+'\')" title="Удалить">🗑️</button>';
  }
  html+='<button class="msg-action-btn" onclick="window.pinMessage(\''+msgId+'\',\''+(m.text||'').replace(/'/g,"\\'")+'\',\''+(m.senderName||'').replace(/'/g,"\\'")+'\')" title="Закрепить">📌</button>';
  html+='</div>';
  html+='<div class="reaction-picker-popup" id="rp-'+msgId+'" style="position:absolute;top:-40px;right:16px;background:var(--bg-secondary);border-radius:5px;padding:6px;display:none;gap:4px;box-shadow:0 8px 16px rgba(0,0,0,.24);z-index:100;">';
  REACTION_EMOJIS.forEach(function(e){
    html+='<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border-radius:4px;" onmouseover="this.style.background=\'var(--bg-modifier-hover)\'" onmouseout="this.style.background=\'\'" onclick="window.addReaction(\''+msgId+'\',\''+e+'\')">'+e+'</div>';
  });
  html+='</div>';
  div.innerHTML=html;
  wrapper.appendChild(div);
};

window.formatMessageText=function(text){
  let html=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html=html.replace(/@(\w+)/g,'<span style="background:rgba(88,101,242,.3);color:#dee0fc;padding:0 2px;border-radius:3px;cursor:pointer;font-weight:500;">@$1</span>');
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
  html=html.replace(/~~(.+?)~~/g,'<s>$1</s>');
  html=html.replace(/`(.+?)`/g,'<code style="background:var(--bg-tertiary);padding:2px 4px;border-radius:3px;font-family:monospace;">$1</code>');
  return html;
};

window.renderReactions=function(reactions){
  var result='';
  Object.keys(reactions).forEach(function(emoji){
    var users=reactions[emoji];
    var isOwn=users.indexOf(currentUser.uid)!==-1;
    result+='<div class="reaction '+(isOwn?'own':'')+'" onclick="window.toggleReaction(\''+emoji+'\')">'+emoji+'<span class="reaction-count">'+users.length+'</span></div>';
  });
  return result;
};

window.sendMessage=async function(){
  const input=document.getElementById('messageInput');
  const text=input.value.trim();
  if(!text&&!selectedFile)return;
  if(!currentChannelId){alert('Выберите канал');return;}
  const colPath=currentServerId?('servers/'+currentServerId+'/channels/'+currentChannelId+'/messages'):('dm/'+currentChannelId+'/messages');
  const msgData={
    text:text,
    senderId:currentUser.uid,
    senderName:currentUserData.name||'User',
    senderAvatar:currentUserData.avatar||null,
    timestamp:serverTimestamp(),
    isEdited:false,
    readBy:[currentUser.uid]
  };
  if(replyTo){
    msgData.replyTo={messageId:replyTo.id,senderName:replyTo.name,text:replyTo.text};
  }
  if(selectedFile){
    if(selectedFile.type.startsWith('image/')){
      msgData.image=selectedFile.data;
    }
  }
  const mentions=text.match(/@(\w+)/g)||[];
  if(mentions.length>0){
    msgData.mentions=mentions.map(function(m){return m.substring(1);});
  }
  try{
    await addDoc(collection(db,colPath),msgData);
    input.value='';
    replyTo=null;
    selectedFile=null;
    input.placeholder='Написать сообщение';
  }catch(e){console.error(e);alert('Ошибка отправки: '+e.message);}
};

window.handleMessageKey=function(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    window.sendMessage();
  }
};

window.addReaction=async function(msgId,emoji){
  const colPath=currentServerId?('servers/'+currentServerId+'/channels/'+currentChannelId+'/messages'):('dm/'+currentChannelId+'/messages');
  const msgRef=doc(db,colPath,msgId);
  const msgDoc=await getDoc(msgRef);
  if(!msgDoc.exists())return;
  const m=msgDoc.data();
  const reactions=m.reactions||{};
  if(!reactions[emoji])reactions[emoji]=[];
  if(reactions[emoji].indexOf(currentUser.uid)!==-1){
    reactions[emoji]=reactions[emoji].filter(function(u){return u!==currentUser.uid;});
    if(reactions[emoji].length===0)delete reactions[emoji];
  }else{
    reactions[emoji].push(currentUser.uid);
  }
  await updateDoc(msgRef,{reactions:reactions});
  document.querySelectorAll('[id^="rp-"]').forEach(function(p){p.style.display='none';});
};

window.handleFileSelect=function(event){
  const file=event.target.files[0];
  if(!file)return;
  if(file.size>5000000){alert('Максимум 5MB');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    selectedFile={type:file.type,data:e.target.result};
    alert('Файл прикреплен: '+file.name);
  };
  reader.readAsDataURL(file);
  event.target.value='';
};

window.loadServerMembers=function(serverId){
  if(membersUnsub)membersUnsub();
  const list=document.getElementById('membersList');
  const q=query(collection(db,'servers',serverId,'members'));
  membersUnsub=onSnapshot(q,async function(snap){
    list.innerHTML='';
    const online=[],offline=[];
    for(const d of snap.docs){
      try{
        const udoc=await getDoc(doc(db,'users',d.id));
        if(udoc.exists()){
          const ud=udoc.data();
          const isOnline=ud.status==='online';
          (isOnline?online:offline).push({uid:d.id,name:ud.name,avatar:ud.avatar,status:ud.status});
        }
      }catch(e){}
    }
    if(online.length>0){
      list.innerHTML+='<div class="member-category">В сети — '+online.length+'</div>';
      online.forEach(function(m){
        const div=document.createElement('div');
        div.className='member';
        const avStyle=m.avatar?('background-image:url('+m.avatar+')'):'';
        const avText=m.avatar?'':(m.name||'?').charAt(0).toUpperCase();
        div.innerHTML='<div class="member-avatar" style="'+avStyle+'">'+avText+'<div class="status-dot online"></div></div><div class="member-name">'+m.name+'</div>';
        div.onclick=function(){window.openDM(m.uid,m.name,null);};
        list.appendChild(div);

    }
    if(offline.length>0){
      list.innerHTML+='<div class="member-category">Не в сети — '+offline.length+'</div>';
      offline.forEach(function(m){
        const div=document.createElement('div');
        div.className='member offline';
        const avStyle=m.avatar?('background-image:url('+m.avatar+')'):'';
        const avText=m.avatar?'':(m.name||'?').charAt(0).toUpperCase();

  const pinnedRef=doc(db,colPath,'pinned','list');
  try{
    const pinnedDoc=await getDoc(pinnedRef);
    const current=pinnedDoc.exists()?(pinnedDoc.data().messages||[]):[];
    const already=current.find(function(p){return p.messageId===msgId;});
    if(already){alert('Уже закреплено');return;}
    await updateDoc(pinnedRef,{messages:arrayUnion({messageId:msgId,text:text.substring(0,100),senderName:name,timestamp:serverTimestamp()})},{merge:true});

    await setDoc(pinnedRef,{messages:[{messageId:msgId,text:text.substring(0,100),senderName:name,timestamp:serverTimestamp()}]});

};

  const content=document.getElementById('settingsContent');
  if(tab==='account'){
    content.innerHTML='<div class="settings-title">Мой аккаунт</div><div class="avatar-upload" id="settingsAvatar" onclick="document.getElementById(\'settingsAvatarInput\').click()" style="'+(currentUserData.avatar?('background-image:url('+currentUserData.avatar+')'):(''))+'">'+(currentUserData.avatar?(''):((currentUserData.name||'U').charAt(0).toUpperCase()))+'<input type="file" id="settingsAvatarInput" accept="image/*" style="display:none" onchange="window.handleSettingsAvatar(event)"></div><div class="form-group"><label class="form-label">Имя пользователя</label><input class="modal-input" id="settingsName" value="'+(currentUserData.name||'')+'"></div><div class="form-group"><label class="form-label">Email</label><input class="modal-input" value="'+(currentUserData.email||'')" disabled></div><div class="form-group"><label class="form-label">Статус</label><select class="form-select" id="settingsStatus"><option value="online" '+(currentUserData.status==='online'?'selected':'')+'>🟢 В сети</option><option value="idle" '+(currentUserData.status==='idle'?'selected':'')+'>🌙 Отошел</option><option value="dnd" '+(currentUserData.status==='dnd'?'selected':'')+'>🚫 Не беспокоить</option></select></div><div class="form-group"><label class="form-label">Пользовательский статус</label><input class="modal-input" id="settingsCustomStatus" value="'+(currentUserData.customStatus||'')+'" placeholder="Например: работаю"></div><button class="btn btn-primary" onclick="window.saveSettings()">Сохранить изменения</button>';
  }else if(tab==='appearance'){
    content.innerHTML='<div class="settings-title">Внешний вид</div><div style="color:var(--text-muted);">Тема: Тёмная (по умолчанию)</div>';
  }else if(tab==='voice'){
    content.innerHTML='<div class="settings-title">Голос и видео</div><div style="color:var(--text-muted);">Настройка устройств</div>';
  }
};

window.handleSettingsAvatar=function(event){
  const file=event.target.files[0];
  if(!file||file.size>1000000){if(file)alert('Максимум 1MB');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('settingsAvatar').style.backgroundImage='url('+e.target.result+')';
    document.getElementById('settingsAvatar').textContent='';
    document.getElementById('settingsAvatar').dataset.newAvatar=e.target.result;
  };
  reader.readAsDataURL(file);
};

window.saveSettings=async function(){
  const name=document.getElementById('settingsName').value.trim();
  const status=document.getElementById('settingsStatus').value;
  const customStatus=document.getElementById('settingsCustomStatus').value.trim();
  const newAvatar=document.getElementById('settingsAvatar').dataset.newAvatar||currentUserData.avatar||null;
  if(!name){alert('Имя не может быть пустым');return;}
  try{
    await updateDoc(doc(db,'users',currentUser.uid),{name:name,avatar:newAvatar,status:status,customStatus:customStatus});
    currentUserData={...currentUserData,name:name,avatar:newAvatar,status:status,customStatus:customStatus};
    window.updateUserPanel();
    alert('Сохранено!');
  }catch(e){alert('Ошибка: '+e.message);}
};

window.toggleGlobalMute=function(){
  const btn=document.getElementById('globalMuteBtn');
  if(btn.textContent==='🎤'){btn.textContent='🔇';btn.style.color='var(--red)';}
  else{btn.textContent='🎤';btn.style.color='';}
};

window.confirmLogout=async function(){
  if(!confirm('Выйти из аккаунта?'))return;
  try{
    await updateDoc(doc(db,'users',currentUser.uid),{status:'offline'});
    await signOut(auth);
    window.hideSettings();
    window.location.href='index.html';
  }catch(e){}
};

window.joinVoice=async function(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    alert('Вы подключились к голосовому каналу! Микрофон активен.');
  }catch(e){alert('Ошибка микрофона: '+e.message);}
};

document.addEventListener('click',function(e){
  if(!e.target.closest('[id^="rp-"]')&&!e.target.closest('.msg-action-btn')){
    document.querySelectorAll('[id^="rp-"]').forEach(function(p){p.style.display='none';});
  }
  if(!e.target.closest('#emojiGrid')&&!e.target.closest('.input-btn')){
    if(window._emojiGrid)window._emojiGrid.style.display='none';
  }
});

initEmojiPicker();
</script>
