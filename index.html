<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sniggers — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(139,92,246,.25),transparent 50%),radial-gradient(circle at 80% 80%,rgba(236,72,153,.2),transparent 50%);z-index:0}
.card{position:relative;z-index:1;width:90%;max-width:420px;background:rgba(15,15,21,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:8px;font-size:32px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#a0a0b0;font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#a0a0b0;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 16px;background:#151520;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;font-size:14px;outline:none;transition:border .2s}
.field input:focus{border-color:#8b5cf6}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s,opacity .2s;margin-top:8px}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.switch{text-align:center;margin-top:20px;font-size:13px;color:#a0a0b0}
.switch a{color:#8b5cf6;cursor:pointer;font-weight:600;text-decoration:none}
.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.ok{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">Sniggers</div>
  <div class="sub" id="subText">Войдите в свой аккаунт</div>
  <div class="err" id="errBox"></div>
  <div class="ok" id="okBox"></div>
  <form id="authForm">
    <div class="field" id="nameField" style="display:none">
      <label>Имя пользователя</label>
      <input type="text" id="regName" placeholder="Как вас зовут?">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
    </div>
    <button type="submit" class="btn" id="submitBtn">Войти</button>
  </form>
  <div class="switch" id="switchText">Нет аккаунта? <a onclick="toggleMode()">Зарегистрироваться</a></div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,updateProfile}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig={apiKey:"AIzaSyBSAzrVn3G9_14VtQZ9TkffdNlhwPe0HkE",authDomain:"ss-a7e6b.firebaseapp.com",projectId:"ss-a7e6b",storageBucket:"ss-a7e6b.firebasestorage.app",messagingSenderId:"919088676851",appId:"1:919088676851:web:a1c73cbd463143fff19c86",measurementId:"G-WBVDW0EMDX"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let mode='login';
window.toggleMode=function(){
  mode=mode==='login'?'register':'login';
  document.getElementById('nameField').style.display=mode==='register'?'block':'none';
  document.getElementById('submitBtn').textContent=mode==='register'?'Создать аккаунт':'Войти';
  document.getElementById('subText').textContent=mode==='register'?'Создайте новый аккаунт':'Войдите в свой аккаунт';
  document.getElementById('switchText').innerHTML=mode==='register'?'Уже есть аккаунт? <a onclick="toggleMode()">Войти</a>':'Нет аккаунта? <a onclick="toggleMode()">Зарегистрироваться</a>';
  hideMsg();
};
function showErr(m){const b=document.getElementById('errBox');b.textContent=m;b.style.display='block';document.getElementById('okBox').style.display='none';}
function showOk(m){const b=document.getElementById('okBox');b.textContent=m;b.style.display='block';document.getElementById('errBox').style.display='none';}
function hideMsg(){document.getElementById('errBox').style.display='none';document.getElementById('okBox').style.display='none';}

document.getElementById('authForm').addEventListener('submit',async(e)=>{
  e.preventDefault();hideMsg();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('submitBtn');btn.disabled=true;
  try{
    if(mode==='register'){
      const name=document.getElementById('regName').value.trim()||email.split('@')[0];
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:name});
      const disc=String(Math.floor(Math.random()*9000)+1000);
      await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name:name,email:email,friends:[],channels:['general'],groups:[],status:'online',avatar:null,customStatus:'',discriminator:disc},{merge:true});
      showOk('Аккаунт создан! Переходим…');
    }else{
      await signInWithEmailAndPassword(auth,email,password);
      showOk('Вход выполнен! Переходим…');
    }
  }catch(err){
    const map={'auth/invalid-email':'Некорректный email','auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/email-already-in-use':'Email уже занят','auth/weak-password':'Пароль слишком слабый (мин. 6 символов)','auth/network-request-failed':'Нет соединения с интернетом'};
    showErr(map[err.code]||err.message);
  }finally{btn.disabled=false;}
});

onAuthStateChanged(auth,(user)=>{if(user)window.location.href='app.html';});
</script>
</body>
</html>
