<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniggers Messenger - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: #f0f2f5; padding: 4px; border-radius: 12px; }
        .tab {
            flex: 1; padding: 12px; text-align: center; border-radius: 8px;
            cursor: pointer; font-weight: 600; transition: all 0.3s; color: #65676b;
        }
        .tab.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .form { display: none; }
        .form.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e4e6eb;
            border-radius: 10px; font-size: 14px; transition: all 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .error {
            background: #fee; color: #c33; padding: 12px; border-radius: 8px;
            font-size: 13px; margin-bottom: 16px; display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">💬</div>
            <h1>Sniggers</h1>
            <p>Мессенджер для команд</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Вход</div>
            <div class="tab" onclick="switchTab('register')">Регистрация</div>
        </div>

        <div class="error" id="error"></div>

        <div class="form active" id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="login()">Войти</button>
        </div>

        <div class="form" id="registerForm">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="regName" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPass" placeholder="Минимум 6 символов">
            </div>
            <button class="btn" onclick="register()">Создать аккаунт</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // ⚠️ ВСТАВЬ СЮДА СВОЮ КОНФИГУРАЦИЮ ИЗ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBSAzrVn3G9_14VtQZ9TkffdNlhwPe0HkE",
            authDomain: "ss-a7e6b.firebaseapp.com",
            projectId: "ss-a7e6b",
            storageBucket: "ss-a7e6b.firebasestorage.app",
            messagingSenderId: "919088676851",
            appId: "1:919088676851:web:a1c73cbd463143fff19c86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1)));
            document.querySelectorAll('.form').forEach((f, i) => f.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1)));
            document.getElementById('error').classList.remove('show');
        };

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('show');
        }

        window.login = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = event.target;
            
            if (!email || !pass) { showError('Заполните все поля'); return; }

            btn.disabled = true;
            btn.textContent = 'Вход...';

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'app.html';
            } catch (e) {
                let msg = 'Ошибка входа';
                if (e.code === 'auth/user-not-found') msg = 'Пользователь не найден';
                if (e.code === 'auth/wrong-password') msg = 'Неверный пароль';
                if (e.code === 'auth/invalid-email') msg = 'Неверный email';
                showError(msg);
            }
            btn.disabled = false;
            btn.textContent = 'Войти';
        };

        window.register = async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const btn = event.target;

            if (!name || !email || !pass) { showError('Заполните все поля'); return; }
            if (pass.length < 6) { showError('Пароль должен быть минимум 6 символов'); return; }

            btn.disabled = true;
            btn.textContent = 'Создание...';

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: name });
                
                await setDoc(doc(db, 'users', userCred.user.uid), {
                    uid: userCred.user.uid,
                    name: name,
                    email: email,
                    friends: [],
                    channels: ['general'],
                    status: 'online',
                    createdAt: new Date().toISOString()
                });

                // Создаем общий канал general
                await setDoc(doc(db, 'channels', 'general'), {
                    name: 'general',
                    type: 'public',
                    createdAt: new Date().toISOString(),
                    members: [userCred.user.uid]
                }, { merge: true });

                window.location.href = 'app.html';
            } catch (e) {
                let msg = 'Ошибка регистрации';
                if (e.code === 'auth/email-already-in-use') msg = 'Email уже используется';
                if (e.code === 'auth/invalid-email') msg = 'Неверный email';
                if (e.code === 'auth/weak-password') msg = 'Слабый пароль';
                showError(msg);
            }
            btn.disabled = false;
            btn.textContent = 'Создать аккаунт';
        };

        auth.onAuthStateChanged((user) => {
            if (user) window.location.href = 'app.html';
        });
    </script>
</body>
</html>
